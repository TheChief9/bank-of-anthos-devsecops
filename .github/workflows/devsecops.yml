name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "tesi-devsecops-anchor" ]
  pull_request:
    branches: [ "tesi-devsecops-anchor" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Scansione SAST con Semgrep (SARIF)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep \
            semgrep scan --config=p/default --metrics=off --sarif --output=semgrep.sarif . || true

      - name: Salva report Semgrep come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-report
          path: semgrep.sarif

      - name: Upload report Semgrep su GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy-security-scan:
    name: Trivy - Vulnerabilities & Misconfigurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Scansione Filesystem con Trivy (SARIF)
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Salva report Trivy come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-report
          path: trivy-results.sarif

      - name: Upload report Trivy su GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
